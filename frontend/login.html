<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSwap Campus - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <div class="container">
        <h1>🎓 SkillSwap Campus</h1>
        <h2>Student Sign In</h2>

        <form id="loginForm">
            <div>
                <label style="font-size: 13px; font-weight: 600; color: var(--secondary); margin-bottom: 5px; display: block;">Campus Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="student@college.edu"
                    required
                >
            </div>

            <div>
                <label style="font-size: 13px; font-weight: 600; color: var(--secondary); margin-bottom: 5px; display: block;">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" id="submitBtn">
                Sign In
            </button>
        </form>

        <p id="message"></p>

        <p style="text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-muted);">
            Don't have an account?
            <a href="register.html" style="color: var(--primary); font-weight: 600; text-decoration: none;">Create Account</a>
        </p>

        <p style="text-align: center; margin-top: 10px; font-size: 13px;">
            <a href="index.html" style="color: var(--text-muted); text-decoration: none;">← Back to Home</a>
        </p>
    </div>

    <script src="js/config.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/login.js"></script>

</body>
</html>
